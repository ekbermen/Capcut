          const FX={'Orijinal':{bright:0,contrast:1,sat:1,blur:0,sharp:0,vig:0,grain:0,gray:false,sepia:false},'Sinematik':{bright:-0.04,contrast:1.3,sat:0.85,vig:0.5,grain:6,gray:false,sepia:false},'Canlı':{bright:0.03,contrast:1.15,sat:1.6,sharp:0.8,gray:false,sepia:false},'Nostalji':{contrast:1.05,sat:0.9,vig:0.4,grain:14,sepia:true,gray:false},'Siyah beyaz':{contrast:1.2,gray:true,sepia:false,grain:8},'Rüya':{bright:0.08,contrast:0.95,sat:1.2,blur:2,gray:false,sepia:false}};
          const PL={'YouTube 4K':{res:'2160',fps:'30',aspect:'16:9'},'TikTok / Reels':{res:'1080',fps:'30',aspect:'9:16'},'Instagram':{res:'1080',fps:'30',aspect:'4:5'},'WhatsApp durum':{res:'720',fps:'30',aspect:'9:16'},'Sinematik 24':{res:'1080',fps:'24',aspect:'16:9'},'Akıcı 60':{res:'1080',fps:'60'},'YouTube Shorts':{res:'1080',fps:'30',aspect:'9:16'},'YouTube 1080':{res:'1080',fps:'30',aspect:'16:9'},'Facebook':{res:'1080',fps:'30',aspect:'16:9'},'X / Twitter':{res:'720',fps:'30',aspect:'16:9'},'LinkedIn':{res:'1080',fps:'30',aspect:'1:1'},'Twitch klip':{res:'1080',fps:'60',aspect:'16:9'},'Pinterest':{res:'1080',fps:'30',aspect:'2:3'},'Snapchat':{res:'1080',fps:'30',aspect:'9:16'},'Telegram':{res:'720',fps:'30',aspect:'orig'},'Sinema 21:9':{res:'1080',fps:'24',aspect:'21:9'},'Eski TV':{res:'480',fps:'25',aspect:'4:3'},'Hızlı önizleme':{res:'360',fps:'24'}};
          const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),3400)};
          const fmt=s=>(+s).toFixed(1)+'s';
          const cl=(c,o)=>({...c,caps:c.caps&&c.caps.map(x=>({...x})),...o});
          function gv(k){return k==='speed'?((clips[sel]&&clips[sel].speed)||1):S[k]}

          // Arayuz uretimi
          document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab,.pane').forEach(e=>e.classList.remove('on'));t.classList.add('on');$('p-'+t.dataset.t).classList.add('on')});
          ['edit','fx','audio','cap','lib','out'].forEach(tab=>{
            const g=document.querySelector('#p-'+tab+' .gen');
