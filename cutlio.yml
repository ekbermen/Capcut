# CutLio AI - tek dosyalik, ucretsiz, tarayicida calisan yapay zekali video editoru
# Kurulum: bu dosyayi .github/workflows/cutlio.yml olarak ekle ve push et.
# Sonra repo > Settings > Pages > Source: "GitHub Actions". Site otomatik yayinlanir.
name: CutLio

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: FFmpeg.wasm dosyalarini indir ve siteye kopyala
        run: |
          mkdir -p site/ff /tmp/deps
          cd /tmp/deps && npm init -y >/dev/null
          npm i @ffmpeg/ffmpeg@0.12.10 @ffmpeg/core@0.12.6 @ffmpeg/util@0.12.1
          cp -r node_modules/@ffmpeg/ffmpeg/dist/umd "$GITHUB_WORKSPACE/site/ff/ffmpeg"
          cp -r node_modules/@ffmpeg/core/dist/umd "$GITHUB_WORKSPACE/site/ff/core"
          cp -r node_modules/@ffmpeg/util/dist/umd "$GITHUB_WORKSPACE/site/ff/util"
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf "$GITHUB_WORKSPACE/site/ff/font.ttf"

      - name: CutLio logosunu ciz (SVG)
        run: |
          cat > site/logo.svg <<'CUTLIO_LOGO'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5c8a"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><rect width="48" height="48" rx="13" fill="url(#g)"/><path d="M32 16a12.5 12.5 0 1 0 0 16" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><path d="M21.5 19.5v9l8-4.5z" fill="#fff"/><path d="M37 7L22 41" stroke="#6ee7f9" stroke-width="2.6" stroke-linecap="round"/></svg>
          CUTLIO_LOGO

      - name: CutLio arayuzunu olustur
        run: |
          cat > site/index.html <<'CUTLIO_EOF'
          <!doctype html>
          <html lang="tr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>CutLio AI</title>
          <link rel="icon" href="logo.svg" type="image/svg+xml">
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
          <style>
          :root{--ink:#141226;--panel:#1d1a33;--panel2:#262244;--line:#352f5c;--text:#f1eeff;--mute:#a29cc9;--pink:#ff5c8a;--cyan:#6ee7f9;--r:14px}
          *{box-sizing:border-box;margin:0}
          html,body{height:100%}
          body{font-family:Sora,system-ui,sans-serif;background:var(--ink);color:var(--text);display:flex;flex-direction:column;overflow:hidden}
          button,input,select,textarea{font:inherit;color:inherit}
          :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
          #splash{position:fixed;inset:0;z-index:50;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s}
          #splash.hide{opacity:0;pointer-events:none}
          #splash .nm{font-weight:800;font-size:26px;letter-spacing:-.5px;opacity:0;animation:fi .6s .7s forwards}
          @keyframes fi{to{opacity:1}}
          .draw{stroke-dasharray:90;stroke-dashoffset:90;animation:dr 1s .1s forwards}
          @keyframes dr{to{stroke-dashoffset:0}}
          header{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#1d1a33,#2a1d45,#1d1a33);background-size:200% 100%;animation:flow 14s linear infinite}
          @keyframes flow{to{background-position:200% 0}}
          .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.5px}
          .logo img{width:34px;height:34px}
          .logo b{background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
          header .sp{flex:1}
          .btn{border:1px solid var(--line);background:var(--panel2);padding:8px 12px;border-radius:10px;cursor:pointer;transition:transform .15s,background .2s,border-color .2s;font-size:13px}
          .btn:hover{background:#312b58;border-color:var(--pink);transform:translateY(-1px)}
          .btn:active{transform:scale(.97)}
          .btn:disabled{opacity:.5;cursor:wait}
          .btn.pri{background:linear-gradient(135deg,var(--pink),#a855f7);border:0;font-weight:600}
          main{flex:1;min-height:0;display:grid;grid-template-columns:300px 1fr 330px;grid-template-rows:minmax(0,1fr) auto;gap:12px;padding:12px}
          .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;overflow:auto}
          #left{grid-row:1/3}
          #stage{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at 50% 30%,#2a2350,#171430);overflow:hidden}
          #stage video{max-width:100%;max-height:100%;min-height:0;border-radius:10px;box-shadow:0 20px 60px #0008;transition:filter .2s,transform .3s}
          #drop{position:absolute;inset:14px;border:2px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mute);cursor:pointer;transition:.25s;text-align:center}
          #drop:hover,#drop.on{border-color:var(--cyan);color:var(--text);background:#6ee7f90d}
          #drop big{font-size:44px;animation:bob 2.4s ease-in-out infinite}
          @keyframes bob{50%{transform:translateY(-8px)}}
          #ovtxt{position:absolute;left:0;right:0;text-align:center;font-weight:800;text-shadow:0 2px 8px #000;pointer-events:none}
          #clips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;min-height:50px}
          .clip{position:relative;flex:1 0 90px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;transition:.2s;font-size:12px;overflow:hidden}
          .clip i{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--pink),var(--cyan));width:0}
          .clip.sel{border-color:var(--pink);box-shadow:0 0 0 2px #ff5c8a44}
          .clip small{color:var(--mute);display:block;margin-top:3px}
          .row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);flex-wrap:wrap;margin-top:8px}
          .row input[type=range]{flex:1;min-width:80px;accent-color:var(--pink)}
          .row .v{width:48px;text-align:right;color:var(--text)}
          h3{font-size:13px;margin:14px 0 8px;color:var(--cyan);font-weight:600}
          h3:first-child{margin-top:0}
          .ctl{display:grid;gap:8px;margin-bottom:6px}
          .ctl label{display:grid;grid-template-columns:86px 1fr 44px;gap:8px;align-items:center;font-size:12px;color:var(--mute)}
          .ctl .v{text-align:right;color:var(--text)}
          .ctl input[type=range]{accent-color:var(--pink);width:100%}
          select,input[type=text],input[type=password],textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;outline:0;transition:border-color .2s;font-size:13px}
          select:focus,input:focus,textarea:focus{border-color:var(--cyan)}
          textarea{resize:vertical;min-height:64px}
          .chips{display:flex;flex-wrap:wrap;gap:6px}
          .chip{padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);font-size:12px;cursor:pointer;transition:.2s;user-select:none}
          .chip.on{background:var(--pink);border-color:var(--pink)}
          .chip:hover{border-color:var(--cyan)}
          #prog{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;display:none;margin-top:10px}
          #prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--cyan));transition:width .2s}
          #toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,90px);background:var(--panel2);border:1px solid var(--cyan);padding:10px 16px;border-radius:12px;transition:transform .35s cubic-bezier(.2,1.4,.4,1);z-index:9;max-width:90vw;font-size:13px}
          #toast.show{transform:translate(-50%,0)}
          .tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
          .tab{flex:1 0 28%;text-align:center;padding:8px 2px;border-radius:10px;cursor:pointer;font-size:11px;background:var(--panel2);border:1px solid transparent;transition:.2s}
          .tab.on{border-color:var(--pink);background:#ff5c8a1f}
          .pane{display:none}.pane.on{display:block;animation:in .25s}
          @keyframes in{from{opacity:0;transform:translateY(6px)}}
          .note{font-size:11px;color:var(--mute);line-height:1.5;margin-top:8px}
          .aibox{background:linear-gradient(135deg,#ff5c8a14,#6ee7f914);border:1px solid var(--line);border-radius:12px;padding:12px}
          #cap{position:absolute;left:8%;right:8%;text-align:center;background:#000a;padding:4px 10px;border-radius:8px;font-weight:600;display:none;pointer-events:none;width:fit-content;margin:0 auto}
          .caprow{display:flex;gap:6px;margin-bottom:6px}.caprow input{flex:1}.caprow .btn{padding:6px 9px}
          #social{white-space:pre-wrap;font:inherit;font-size:12px;margin-top:8px;color:var(--text);cursor:copy}
          #badge{font-size:12px;margin-top:8px;color:var(--mute)}
          #badge.ok{color:var(--cyan)}
          @media(max-width:900px){body{overflow:auto}main{display:flex;flex-direction:column}#stage{min-height:320px}.card{overflow:visible}}
          @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}}
          </style>
          </head>
          <body>
          <div id="splash">
            <svg width="104" height="104" viewBox="0 0 48 48"><defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5c8a"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><rect width="48" height="48" rx="13" fill="url(#g2)"/><path class="draw" d="M32 16a12.5 12.5 0 1 0 0 16" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><path d="M21.5 19.5v9l8-4.5z" fill="#fff"/><path class="draw" d="M37 7L22 41" stroke="#6ee7f9" stroke-width="2.6" stroke-linecap="round"/></svg>
            <div class="nm">CutLio AI</div>
          </div>
          <header>
            <div class="logo"><img src="logo.svg" alt=""><span>Cut<b>Lio</b> AI</span></div><div class="sp"></div>
            <button class="btn" id="undoBtn" title="Geri al (Ctrl+Z)">↶</button>
            <button class="btn" id="redoBtn" title="İleri al (Ctrl+Y)">↷</button>
            <button class="btn" id="addBtn">+ Video</button>
            <button class="btn pri" id="exportBtn">Dışa aktar</button>
            <input type="file" id="file" accept="video/*" multiple hidden>
            <input type="file" id="mfile" accept="audio/*" hidden>
          </header>
          <main>
            <section class="card" id="left">
              <div class="tabs"><div class="tab on" data-t="edit">Düzenle</div><div class="tab" data-t="fx">Efekt</div><div class="tab" data-t="audio">Ses</div><div class="tab" data-t="cap">Altyazı</div><div class="tab" data-t="lib">Kütüphane</div><div class="tab" data-t="out">Çıktı</div></div>
              <div class="pane on" id="p-edit"><div class="gen"></div><div class="chips" id="spd" style="margin:6px 0"></div>
                <h3>Dönüş</h3><div class="chips"><div class="chip" id="rotBtn">↻ 90°</div></div>
                <h3>Yazı</h3><input type="text" id="text" placeholder="Videoya yazı ekle">
              </div>
              <div class="pane" id="p-fx"><div class="gen"></div><h3>Hazır filtreler</h3><div class="chips" id="presets"></div></div>
              <div class="pane" id="p-audio"><div class="gen"></div>
                <h3>Arka plan müziği</h3><div class="chips"><div class="chip" id="musicBtn">🎵 Müzik seç</div><div class="chip" id="musicClr" style="display:none">✕ Kaldır</div></div><div class="note" id="musicName"></div>
              </div>
              <div class="pane" id="p-cap"><div class="gen"></div>
                <h3>Altyazı</h3><div class="chips"><div class="chip" id="capAuto">🎙 Otomatik altyazı</div><div class="chip" id="srtBtn">⬇ SRT</div><div class="chip" id="capClr">✕ Temizle</div></div>
                <h3>Çeviri</h3><div class="row" style="margin:0"><select id="lang" style="flex:1"><option>Türkçe</option><option>English</option><option>Español</option><option>Deutsch</option><option>Français</option><option>Italiano</option><option>Русский</option><option>العربية</option><option>日本語</option><option>한국어</option></select><div class="chip" id="trBtn">Çevir</div></div>
                <h3>AI özet</h3><div class="row" style="margin:0"><input type="text" id="hlSec" value="30" style="width:64px"> sn<div class="chip" id="hlBtn">✨ Özet çıkar</div></div>
                <div class="note" id="capMsg">Otomatik altyazı için Groq (ücretsiz), OpenAI veya Gemini anahtarı bağla.</div>
                <div id="capList" style="margin-top:8px"></div>
              </div>
              <div class="pane" id="p-lib">
                <input type="text" id="fxq" placeholder="Efekt ara: glitch, yankı, noir...">
                <div class="chips" id="cats" style="margin:8px 0"></div>
                <div class="chips" id="fxl" style="max-height:300px;overflow:auto"></div>
                <div class="chips" style="margin:8px 0"><div class="chip" id="fxPrev">👁 3 sn önizle</div><div class="chip" id="fxRand">🎲 Rastgele</div><div class="chip" id="fxClr">✕ Temizle</div></div>
                <div class="note">Seçili efektler dışa aktarmada uygulanır. Önizle ile 3 saniyelik düşük çözünürlüklü deneme izleyebilirsin.</div>
                <h3>Filigran</h3><input type="text" id="wm" placeholder="Filigran yazısı (ör. @kullanici)">
                <div class="gen"></div>
              </div>
              <div class="pane" id="p-out"><div class="gen"></div>
                <h3>Hızlı hazırlar</h3><div class="chips" id="plat"></div>
                <p class="note">Her şey tarayıcında işlenir, dosyaların hiçbir yere yüklenmez. 4K dışa aktarma uzun sürer ve çok bellek ister; kısa klipler için idealdir.</p>
              </div>
            </section>

            <section class="card" id="stage">
              <div id="drop"><big>🎬</big><div>Videoyu buraya bırak veya tıkla</div><small>MP4, MOV, WebM</small></div>
              <video id="v" playsinline controls style="display:none"></video>
              <div id="ovtxt"></div><div id="cap"></div>
            </section>

            <section class="card" id="right">
              <h3>Akıllı asistan</h3>
              <div class="aibox">
                <input type="password" id="key" placeholder="API anahtarını yapıştır (herhangi bir sağlayıcı)" autocomplete="off">
                <button class="btn pri" id="connBtn" style="width:100%;margin-top:8px">Bağlan</button>
                <div id="badge">Bağlı değil. Anahtarı yapıştır, sağlayıcıyı ve çalışan modeli kendisi bulur.</div>
                <textarea id="prompt" placeholder="Ne istediğini yaz. Örn: sinematik yap, 1.5x hızlandır, 9:16 yap ve 4K indir" style="margin-top:10px"></textarea>
                <div class="chips" id="ex" style="margin-top:8px"></div>
                <button class="btn pri" id="aiBtn" style="width:100%;margin-top:10px">Asistana uygulat</button>
              </div>
              <div id="aiMsg" class="note"></div>
              <button class="btn" id="socBtn" style="width:100%;margin-top:8px">📣 Başlık + hashtag öner</button><pre id="social" title="Kopyalamak için dokun"></pre>
              <p class="note">Desteklenen: Anthropic, OpenAI, Gemini, OpenRouter, Groq, xAI, Mistral, DeepSeek. Anahtar yalnızca bu tarayıcıda saklanır ve doğrudan sağlayıcıya gider.</p>
              <h3 style="margin-top:18px">Kısayollar</h3>
              <p class="note">Boşluk: oynat/durdur · S: playhead'den böl · Sil: klibi sil · ← →: kare kare · Ctrl+Z / Ctrl+Y: geri/ileri</p>
            </section>

            <section class="card" id="timeline">
              <div id="clips"></div>
              <canvas id="wave" style="width:100%;height:48px;border-radius:8px;background:var(--panel2);margin-top:4px"></canvas>
              <div class="row">Başlangıç<input type="range" id="tin" min="0" max="1" step="0.05" value="0"><span class="v" id="tinV">0s</span></div>
              <div class="row">Bitiş<input type="range" id="tout" min="0" max="1" step="0.05" value="1"><span class="v" id="toutV">0s</span></div>
              <div class="row">
                <button class="btn" id="splitBtn">✂ Böl</button><button class="btn" id="dupBtn">⧉ Kopyala</button><button class="btn" id="silBtn">🔇 Sessizliği kes</button><button class="btn" id="snapBtn">📷 Kare</button>
                <button class="btn" id="leftBtn">←</button><button class="btn" id="rightBtn">→</button><button class="btn" id="delBtn">🗑 Sil</button><button class="btn" id="resetBtn">Sıfırla</button>
              </div>
              <div id="prog"><i></i></div>
              <div class="row"><span id="status" style="flex:1"></span><button class="btn" id="cancelBtn" style="display:none">İptal</button></div>
            </section>
          </main>
          <div id="toast"></div>

          <script src="ff/ffmpeg/ffmpeg.js"></script>
          <script src="ff/util/index.js"></script>
          <script>
          const $=id=>document.getElementById(id);
          const DEF={fxv:[],fxa:[],tstyle:'0',wm:'',wmpos:'br',tc:false,fc:false,zoom:1,panx:0,pany:0,trans:0,capsize:42,cappos:'b',capburn:true,vol:1,mvol:0.35,fin:0,fout:0,rot:0,flip:false,gray:false,sepia:false,rev:false,denoise:false,norm:false,text:'',tsize:56,tpos:'b',bright:0,contrast:1,sat:1,blur:0,sharp:0,vig:0,grain:0,res:'1080',fps:'30',aspect:'orig',fit:'fill',crf:'21',fmt:'mp4'};
          let S={...DEF},clips=[],sel=-1,ff=null,ffReady=false,music=null,hist=[],hi=-1,cur=0,total=1,auto=false,cancelled=false,AI=null;
          const TS=[['Beyaz kontur','fontcolor=white:borderw=3:bordercolor=black','#fff','0 2px 8px #000'],['Sarı','fontcolor=yellow:borderw=3:bordercolor=black','#ffe600','0 2px 8px #000'],['Neon pembe','fontcolor=0xff5c8a:borderw=2:bordercolor=white','#ff5c8a','0 0 12px #ff5c8a'],['Neon turkuaz','fontcolor=0x6ee7f9:borderw=2:bordercolor=0x0a3d66','#6ee7f9','0 0 12px #6ee7f9'],['Siyah kutu','fontcolor=white:box=1:boxcolor=black@0.7:boxborderw=18','#fff','none'],['Beyaz kutu','fontcolor=black:box=1:boxcolor=white@0.85:boxborderw=18','#000','none'],['Kırmızı','fontcolor=red:borderw=3:bordercolor=white','#f33','0 0 4px #fff'],['Yeşil','fontcolor=0x39ff14:borderw=3:bordercolor=black','#39ff14','0 2px 6px #000'],['Turuncu','fontcolor=orange:borderw=3:bordercolor=black','orange','0 2px 6px #000'],['Altın','fontcolor=0xffd700:borderw=3:bordercolor=0x5a3b00','#ffd700','0 2px 6px #5a3b00'],['Gölge','fontcolor=white:shadowx=4:shadowy=4:shadowcolor=black','#fff','4px 4px 0 #000'],['İnce siyah','fontcolor=black:borderw=1:bordercolor=white','#000','0 0 2px #fff']];
          const SL=[['edit','speed','Hız',0.25,4,0.05,v=>v+'x'],['edit','fin','Açılış',0,3,0.1,v=>v+'s'],['edit','fout','Kapanış',0,3,0.1,v=>v+'s'],['edit','tsize','Yazı boyutu',20,140,2,v=>v],['edit','zoom','Yakınlaştır',1,3,0.05,v=>v+'x'],['edit','panx','Yatay kaydır',-1,1,0.05,v=>v],['edit','pany','Dikey kaydır',-1,1,0.05,v=>v],['edit','trans','Klip geçişi',0,1.5,0.1,v=>v+'s'],['cap','capsize','Altyazı boyutu',20,90,2,v=>v],
          ['fx','bright','Parlaklık',-0.5,0.5,0.02,v=>v],['fx','contrast','Kontrast',0.5,2,0.05,v=>v],['fx','sat','Doygunluk',0,3,0.05,v=>v],['fx','blur','Bulanıklık',0,10,0.5,v=>v],['fx','sharp','Keskinlik',0,2,0.1,v=>v],['fx','vig','Vinyet',0,1,0.05,v=>v],['fx','grain','Gren',0,40,1,v=>v],
          ['audio','vol','Video sesi',0,2,0.05,v=>Math.round(v*100)+'%'],['audio','mvol','Müzik sesi',0,1,0.05,v=>Math.round(v*100)+'%']];
          const TG=[['edit','flip','↔ Ayna'],['edit','rev','⏪ Ters oynat'],['fx','gray','Siyah beyaz'],['fx','sepia','Sepya'],['audio','denoise','Gürültü temizle'],['audio','norm','Sesi dengele'],['cap','capburn','Videoya göm'],['lib','tc','Zaman kodu'],['lib','fc','Kare sayacı']];
