          Object.keys(PL).forEach(n=>{const c=document.createElement('div');c.className='chip';c.textContent=n;c.onclick=()=>{Object.assign(S,PL[n]);sync();commit();toast(n+' ayarlandı')};$('plat').append(c)});
          ['Sinematik yap ve 4K indir','TikTok için 9:16, 1.5x hızlı','Eski film gibi yap','Yavaş çekim, 60 fps','Sessiz kısımları kes'].forEach(t=>{const c=document.createElement('div');c.className='chip';c.textContent=t;c.onclick=()=>{$('prompt').value=t};$('ex').append(c)});
          function sync(){
            SL.forEach(([,k,,,,,f])=>{$(k).value=gv(k);$(k+'V').textContent=f(gv(k))});
            TG.forEach(([,k])=>$('t_'+k).classList.toggle('on',!!S[k]));
            SE.forEach(([,k])=>$(k).value=S[k]);$('text').value=S.text;$('wm').value=S.wm;renderFx();
          }

          // Gecmis (geri/ileri)
          function commit(){hist=hist.slice(0,hi+1);hist.push({S:{...S},clips:clips.map(c=>cl(c)),sel});if(hist.length>80)hist.shift();hi=hist.length-1;try{localStorage.setItem('cutlio_S',JSON.stringify(S))}catch(e){}}
          function restore(i){if(i<0||i>=hist.length)return;hi=i;const h=hist[i];S={...h.S};clips=h.clips.map(c=>cl(c));sync();select(Math.min(h.sel,clips.length-1));preview()}
          $('undoBtn').onclick=()=>restore(hi-1);$('redoBtn').onclick=()=>restore(hi+1);

          // Onizleme
          function preview(){
            const v=$('v');v.playbackRate=Math.min(4,Math.max(0.25,(clips[sel]&&clips[sel].speed)||1));v.volume=Math.min(1,S.vol);
            let f=`brightness(${1+S.bright*2}) contrast(${S.contrast}) saturate(${S.sat}) blur(${S.blur}px)`;
            if(S.gray)f+=' grayscale(1)';if(S.sepia)f+=' sepia(.8)';
            v.style.filter=f;v.style.transform=`rotate(${S.rot}deg) scaleX(${S.flip?-1:1}) scale(${S.zoom}) translate(${(-S.panx*(1-1/S.zoom)/2*100).toFixed(1)}%,${(-S.pany*(1-1/S.zoom)/2*100).toFixed(1)}%)`;
            const o=$('ovtxt');o.textContent=S.text;const ts=TS[+S.tstyle]||TS[0];o.style.color=ts[2];o.style.textShadow=ts[3];o.style.fontSize=Math.max(12,S.tsize/3)+'px';
            o.style.top=S.tpos==='t'?'8%':S.tpos==='c'?'45%':'auto';o.style.bottom=S.tpos==='b'?'10%':'auto';
          }

          // Klipler
          function addFiles(list){
            [...list].forEach(f=>{
              const url=URL.createObjectURL(f),t=document.createElement('video');t.preload='metadata';t.src=url;
              t.onloadedmetadata=()=>{clips.push({file:f,url,name:f.name,dur:t.duration,start:0,end:t.duration,speed:1});if(sel<0)select(0);else renderClips();commit();toast('Klip eklendi')};
              t.onerror=()=>toast('Bu dosya video olarak açılamadı');
            });
          }
          function select(i){
            sel=i;renderClips();renderCaps();const c=clips[i],v=$('v');
            if(!c){v.style.display='none';v.removeAttribute('src');delete v.dataset.u;$('drop').style.display='flex';return}
            $('drop').style.display='none';v.style.display='block';
            if(v.dataset.u!==c.url){v.dataset.u=c.url;v.src=c.url;v.onloadedmetadata=()=>{const k=clips[sel];if(!k)return;v.currentTime=k.start;preview();if(auto){auto=false;v.play().catch(()=>{})}}}
            else{v.currentTime=c.start;if(auto){auto=false;v.play().catch(()=>{})}}
            $('tin').max=$('tout').max=c.dur;$('tin').value=c.start;$('tout').value=c.end;trimLabels();preview();sync();wave();
          }
          function trimLabels(){const c=clips[sel];if(!c)return;$('tinV').textContent=fmt(c.start);$('toutV').textContent=fmt(c.end)}
          function renderClips(){
            $('clips').innerHTML='';
            clips.forEach((c,i)=>{const d=document.createElement('div');d.className='clip'+(i===sel?' sel':'');d.style.flexGrow=Math.max(1,c.end-c.start);d.innerHTML=`${c.name.slice(0,16)}<small>${fmt((c.end-c.start)/(c.speed||1))}${c.speed&&c.speed!==1?' · '+c.speed+'x':''}</small><i></i>`;d.onclick=()=>select(i);$('clips').append(d)});drawWave();
          }
          $('tin').oninput=e=>{const c=clips[sel];if(!c)return;c.start=Math.min(+e.target.value,c.end-0.1);$('v').currentTime=c.start;trimLabels();renderClips()};
          $('tout').oninput=e=>{const c=clips[sel];if(!c)return;c.end=Math.max(+e.target.value,c.start+0.1);trimLabels();renderClips()};
          $('tin').onchange=$('tout').onchange=commit;
          $('v').ontimeupdate=()=>{
            const c=clips[sel],v=$('v');if(!c)return;
            showCap(v.currentTime);drawWave();const bar=$('clips').children[sel];if(bar)bar.lastElementChild.style.width=Math.min(100,Math.max(0,(v.currentTime-c.start)/(c.end-c.start)*100))+'%';
            if(v.currentTime>=c.end-0.03){
              if(sel<clips.length-1){auto=!v.paused;select(sel+1)}else{v.pause();v.currentTime=c.start}
            }
          };
          function del(){if(sel<0)return;clips.splice(sel,1);select(clips.length?Math.max(0,sel-1):-1);commit()}
          function split(){const c=clips[sel],t=$('v').currentTime;if(!c||t<=c.start+0.1||t>=c.end-0.1)return toast('Playhead klibin içinde olmalı');clips.splice(sel,1,cl(c,{end:t}),cl(c,{start:t}));select(sel+1);commit();toast('Klip bölündü')}
          $('delBtn').onclick=del;$('splitBtn').onclick=split;
          $('dupBtn').onclick=()=>{if(sel<0)return;clips.splice(sel+1,0,cl(clips[sel]));select(sel+1);commit()};
          $('leftBtn').onclick=()=>{if(sel>0){[clips[sel-1],clips[sel]]=[clips[sel],clips[sel-1]];select(sel-1);commit()}};
          $('rightBtn').onclick=()=>{if(sel>=0&&sel<clips.length-1){[clips[sel+1],clips[sel]]=[clips[sel],clips[sel+1]];select(sel+1);commit()}};
          $('resetBtn').onclick=()=>{S={...DEF};sync();preview();commit();toast('Ayarlar sıfırlandı')};
          $('snapBtn').onclick=()=>{const v=$('v');if(!v.videoWidth)return toast('Önce video ekle');const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cutlio-kare.png';a.click()})};
          $('silBtn').onclick=silenceCut;
          async function silenceCut(){
            const c=clips[sel];if(!c)return toast('Önce bir klip seç');
            toast('Ses analiz ediliyor...');
            try{
              const ac=new (window.AudioContext||window.webkitAudioContext)(),buf=await ac.decodeAudioData(await c.file.arrayBuffer()),d=buf.getChannelData(0),sr=buf.sampleRate,w=Math.floor(sr*0.05);
              const loud=[];for(let i=0;i<d.length;i+=w){let s=0,n=Math.min(w,d.length-i);for(let j=0;j<n;j++)s+=d[i+j]*d[i+j];loud.push(Math.sqrt(s/n)>0.015)}
              const seg=[];let st=null,quiet=0;
              loud.forEach((l,i)=>{const t=i*0.05;if(l){if(st===null)st=t;quiet=0}else if(st!==null){quiet++;if(quiet>=8){seg.push([st,t-quiet*0.05+0.15]);st=null;quiet=0}}});
              if(st!==null)seg.push([st,loud.length*0.05]);
              const out=seg.map(([a,b])=>cl(c,{start:Math.max(c.start,a-0.1),end:Math.min(c.end,b)})).filter(x=>x.end-x.start>0.25);
              if(!out.length)return toast('Sessiz kısım bulunamadı');
              clips.splice(sel,1,...out);select(sel);commit();toast(out.length+' parça kaldı, sessizlikler kesildi');ac.close();
            }catch(e){toast('Ses analiz edilemedi: '+e.message)}
          }

          // Dosya secimi
          $('addBtn').onclick=$('drop').onclick=()=>$('file').click();
          $('file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
          $('musicBtn').onclick=()=>$('mfile').click();
          $('mfile').onchange=e=>{music=e.target.files[0]||null;$('musicName').textContent=music?music.name:'';$('musicClr').style.display=music?'':'none'};
          $('musicClr').onclick=()=>{music=null;$('musicName').textContent='';$('musicClr').style.display='none'};
          const st=$('stage');
          st.ondragover=e=>{e.preventDefault();$('drop').classList.add('on')};st.ondragleave=()=>$('drop').classList.remove('on');
          st.ondrop=e=>{e.preventDefault();$('drop').classList.remove('on');addFiles(e.dataTransfer.files)};
          addEventListener('keydown',e=>{
            if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const v=$('v');
            if(e.code==='Space'){e.preventDefault();v.paused?v.play():v.pause()}
            else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();restore(e.shiftKey?hi+1:hi-1)}
            else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();restore(hi+1)}
            else if(e.key==='s'||e.key==='S')split();
            else if(e.key==='Delete'||e.key==='Backspace')del();
            else if(e.key==='ArrowRight')v.currentTime+=1/(+S.fps);
            else if(e.key==='ArrowLeft')v.currentTime-=1/(+S.fps);
          });

          // ---- Tek API girisi: saglayici + model otomatik ----
          const P={
           anthropic:{n:'Anthropic',t:'a',u:'https://api.anthropic.com/v1',pref:[/sonnet/,/haiku/,/opus/],ex:/^$/},
           openai:{n:'OpenAI',t:'o',u:'https://api.openai.com/v1',pref:[/gpt-4\.1-mini/,/gpt-4o-mini/,/gpt-5-mini/,/gpt-4o$/,/gpt-4\.1$/,/gpt/],ex:/embed|whisper|tts|image|audio|realtime|moderation|transcribe|dall|search|instruct|codex|davinci|babbage|computer/},
           gemini:{n:'Gemini',t:'g',u:'https://generativelanguage.googleapis.com/v1beta',pref:[/gemini-2\.5-flash$/,/gemini-.*flash$/,/flash/,/pro/],ex:/image|tts|embed|live|audio|thinking|robotics|computer|exp|vision|learnlm|gemma/},
           openrouter:{n:'OpenRouter',t:'o',u:'https://openrouter.ai/api/v1',pref:[/claude.*(haiku|sonnet)/,/gpt-4o-mini/,/gemini.*flash/,/llama.*70b/,/:free/],ex:/embed|image|audio|moderation/},
           groq:{n:'Groq',t:'o',u:'https://api.groq.com/openai/v1',pref:[/llama-3\.3-70b/,/llama-3\.1/,/gpt-oss/,/gemma|mixtral|qwen/],ex:/whisper|guard|tts|playai|distil|embed/},
           xai:{n:'xAI',t:'o',u:'https://api.x.ai/v1',pref:[/grok.*mini/,/grok/],ex:/image|embed|vision/},
           mistral:{n:'Mistral',t:'o',u:'https://api.mistral.ai/v1',pref:[/small/,/medium/,/large/,/mistral/],ex:/embed|moderation|ocr|voxtral|codestral/},
           deepseek:{n:'DeepSeek',t:'o',u:'https://api.deepseek.com',pref:[/chat/,/deepseek/],ex:/embed/}
          };
          const guess=k=>/^sk-ant-/.test(k)?['anthropic']:/^sk-or-/.test(k)?['openrouter']:/^gsk_/.test(k)?['groq']:/^AIza/.test(k)?['gemini']:/^xai-/.test(k)?['xai']:/^sk-/.test(k)?['openai','deepseek']:['mistral','openai','groq','deepseek','xai','openrouter','gemini','anthropic'];
          async function jf(url,o){const r=await fetch(url,{...o,signal:AbortSignal.timeout(40000)});const t=await r.text();let d={};try{d=JSON.parse(t)}catch(e){}if(!r.ok)throw new Error((d.error&&(d.error.message||d.error))||d.message||('HTTP '+r.status));return d}
          const hd=(p,k)=>p.t==='a'?{'x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true','content-type':'application/json'}:p.t==='g'?{'content-type':'application/json'}:{authorization:'Bearer '+k,'content-type':'application/json'};
          async function listM(p,k){
            if(p.t==='g'){const d=await jf(`${p.u}/models?pageSize=200&key=${encodeURIComponent(k)}`);return d.models.filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/',''))}
            const d=await jf(p.u+'/models'+(p.t==='a'?'?limit=100':''),{headers:hd(p,k)});return(d.data||[]).map(m=>m.id);
          }
          const rank=(p,ids)=>ids.filter(i=>!p.ex.test(i)).map((id,n)=>{const s=p.pref.findIndex(r=>r.test(id));return{id,s:s<0?99:s,n}}).sort((a,b)=>a.s-b.s||a.n-b.n).map(x=>x.id);
          async function chat(p,k,m,sys,u){
            if(p.t==='a'){const d=await jf(p.u+'/messages',{method:'POST',headers:hd(p,k),body:JSON.stringify({model:m,max_tokens:1200,system:sys,messages:[{role:'user',content:u}]})});return d.content.map(x=>x.text||'').join('')}
            if(p.t==='g'){const d=await jf(`${p.u}/models/${m}:generateContent?key=${encodeURIComponent(k)}`,{method:'POST',headers:hd(p,k),body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{role:'user',parts:[{text:u}]}]})});return d.candidates[0].content.parts.map(x=>x.text||'').join('')}
            const d=await jf(p.u+'/chat/completions',{method:'POST',headers:hd(p,k),body:JSON.stringify({model:m,messages:[{role:'system',content:sys},{role:'user',content:u}]})});return d.choices[0].message.content;
          }
          async function connect(k){
            const errs=[];
            for(const id of guess(k)){
              const p=P[id];
              try{
                const ids=rank(p,await listM(p,k));
                if(!ids.length)throw new Error('uygun model yok');
                for(const m of ids.slice(0,5)){
                  try{await chat(p,k,m,'Reply with OK.','OK');AI={id,m,k};try{localStorage.setItem('cutlio_ai',JSON.stringify(AI))}catch(e){}return AI}
                  catch(e){errs.push(`${p.n}/${m}: ${e.message}`)}
                }
              }catch(e){errs.push(`${p.n}: ${e.message}`)}
            }
            throw new Error(errs.slice(-3).join(' | ')||'Anahtar tanınmadı');
          }
          function badge(){const b=$('badge');if(AI){b.className='ok';b.textContent=`✓ ${P[AI.id].n} · ${AI.m}`;$('connBtn').textContent='Yeniden bağlan'}}
          try{const a=JSON.parse(localStorage.getItem('cutlio_ai')||'null');if(a&&P[a.id]){AI=a;$('key').value=a.k;badge()}}catch(e){}
          try{const s=JSON.parse(localStorage.getItem('cutlio_S')||'null');if(s)S={...DEF,...s}}catch(e){}
          $('connBtn').onclick=async()=>{
            const k=$('key').value.trim();if(!k)return toast('Önce anahtarı yapıştır');
            $('connBtn').disabled=true;$('badge').className='';$('badge').textContent='Sağlayıcı ve model aranıyor...';
            try{await connect(k);badge();toast('Bağlandı')}catch(e){$('badge').textContent='Bağlanamadı: '+e.message}
            $('connBtn').disabled=false;
          };
          async function ask(sys,u){
            try{return await chat(P[AI.id],AI.k,AI.m,sys,u)}
            catch(e){await connect(AI.k);badge();return await chat(P[AI.id],AI.k,AI.m,sys,u)}
          }
          $('aiBtn').onclick=async()=>{
            const p=$('prompt').value.trim();
            if(!AI){const k=$('key').value.trim();if(!k)return toast('Önce API anahtarını gir');try{$('badge').textContent='Bağlanıyor...';await connect(k);badge()}catch(e){return $('badge').textContent='Bağlanamadı: '+e.message}}
            if(!p)return toast('Asistana ne istediğini yaz');
            $('aiBtn').disabled=true;$('aiMsg').textContent='Düşünüyor...';
