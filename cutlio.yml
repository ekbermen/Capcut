          // ---- Altyazi, dalga formu, AI ozet ----
          const WV={};
          async function wave(){
            const c=clips[sel];if(!c)return;
            if(!(c.url in WV)){WV[c.url]=null;if(c.file.size<150e6){try{
              const ac=new (window.AudioContext||window.webkitAudioContext)(),b=await ac.decodeAudioData(await c.file.arrayBuffer()),d=b.getChannelData(0),n=400,w=Math.floor(d.length/n),p=[];
              for(let i=0;i<n;i++){let m=0;for(let j=0;j<w;j+=Math.max(1,w>>6)){const x=Math.abs(d[i*w+j]);if(x>m)m=x}p.push(m)}
              WV[c.url]=p;ac.close();
