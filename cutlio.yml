          $('fxRand').onclick=()=>{const r=n=>Math.floor(Math.random()*n);S.fxv=[r(CV.length),r(CV.length)];renderFx();commit();toast('Rastgele bakış: '+S.fxv.map(i=>CV[i][1]).join(' + '))};
          $('fxPrev').onclick=async()=>{
            const c=clips[sel];if(!c)return toast('Önce bir klip seç');toast('Önizleme hazırlanıyor...');
            try{
              await loadFF();await ff.writeFile('pv_in',await FFmpegUtil.fetchFile(c.file));
              const R=S.res;S.res='360';const sp=c.speed||1,V=vf({...c,end:Math.min(c.end,c.start+3)},99,3,sp,0,0);S.res=R;
              for(const fl of V.files)await ff.writeFile(fl.n,fl.t);
              await ff.exec(['-ss',String(c.start),'-t','3','-i','pv_in',...(V.fc?['-filter_complex',V.fc,'-map','[v]','-map','0:a?']:['-vf',V.chain]),'-af',af(3,sp,0,0),'-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p','-c:a','aac','pv.mp4']);
              const d=await ff.readFile('pv.mp4'),m=document.createElement('div');
              m.style.cssText='position:fixed;inset:0;background:#000c;z-index:40;display:flex;align-items:center;justify-content:center';
              m.innerHTML='<video controls autoplay loop playsinline style="max-width:92vw;max-height:80vh;border-radius:12px"></video>';
              m.firstChild.src=URL.createObjectURL(new Blob([d.buffer],{type:'video/mp4'}));m.onclick=e=>{if(e.target===m)m.remove()};document.body.append(m);
            }catch(e){toast('Önizleme hatası: '+e.message+' (bir efekt bu motorda desteklenmiyor olabilir)');ffReady=false}
          };

          // ---- Disa aktarma (FFmpeg) ----
          async function loadFF(){
            if(ffReady)return;
            ff=new FFmpegWASM.FFmpeg();
            ff.on('progress',({progress})=>{const p=Math.max(0,Math.min(1,progress));$('prog').firstElementChild.style.width=((cur+p)/total*100)+'%'});
            const abs=p=>new URL(p,location.href).href;
            await ff.load({classWorkerURL:abs('ff/ffmpeg/814.ffmpeg.js'),coreURL:abs('ff/core/ffmpeg-core.js'),wasmURL:abs('ff/core/ffmpeg-core.wasm')});
            await ff.writeFile('font.ttf',await FFmpegUtil.fetchFile('ff/font.ttf'));
            ffReady=true;
          }
          const atempo=s=>{const a=[];while(s>2){a.push('atempo=2');s/=2}while(s<0.5){a.push('atempo=0.5');s/=0.5}a.push('atempo='+s.toFixed(4));return a.join(',')};
          const even=n=>Math.max(2,Math.round(n/2)*2);
          function dims(){
            const R=+S.res;if(S.aspect==='orig')return{w:-2,h:R,crop:false};
            const[a,b]=S.aspect.split(':').map(Number);
            return a>=b?{w:even(R*a/b),h:even(R),crop:true}:{w:even(R),h:even(R*b/a),crop:true};
          }
          const wrap=(t,n=32)=>{const L=[];let l='';t.split(/\s+/).forEach(x=>{if((l+' '+x).trim().length>n){L.push(l);l=x}else l=(l+' '+x).trim()});if(l)L.push(l);return L.join('\n')};
          function vf(c,i,dur,sp,fi,fo){
            const d=dims(),f=[],files=[];let fc=null;
            const z=S.zoom>1?`crop=iw/${S.zoom}:ih/${S.zoom}:(iw-iw/${S.zoom})*${(0.5+S.panx/2).toFixed(3)}:(ih-ih/${S.zoom})*${(0.5+S.pany/2).toFixed(3)}`:'';
            if(!d.crop){if(z)f.push(z);f.push(`scale=-2:${d.h}`)}
            else if(S.fit==='blur')fc=`[0:v]${z?z+',':''}split[a][b];[a]scale=${d.w}:${d.h}:force_original_aspect_ratio=increase,crop=${d.w}:${d.h},gblur=sigma=40[bg];[b]scale=${d.w}:${d.h}:force_original_aspect_ratio=decrease[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2`;
            else{if(z)f.push(z);f.push(S.fit==='fit'?`scale=${d.w}:${d.h}:force_original_aspect_ratio=decrease,pad=${d.w}:${d.h}:(ow-iw)/2:(oh-ih)/2:black`:`scale=${d.w}:${d.h}:force_original_aspect_ratio=increase,crop=${d.w}:${d.h}`)}
            if(S.rot===90)f.push('transpose=1');if(S.rot===180)f.push('hflip,vflip');if(S.rot===270)f.push('transpose=2');
            if(S.flip)f.push('hflip');
            if(S.rev)f.push('reverse');
            f.push(`eq=brightness=${S.bright}:contrast=${S.contrast}:saturation=${S.sat}`);
            if(S.blur>0)f.push(`gblur=sigma=${S.blur}`);
            if(S.sharp>0)f.push(`unsharp=5:5:${S.sharp}`);
            if(S.gray)f.push('hue=s=0');
            if(S.sepia)f.push('colorchannelmixer=.393:.769:.189:0:.349:.686:.168:0:.272:.534:.131');
            if(S.vig>0)f.push(`vignette=angle=${(Math.PI/2-S.vig*Math.PI/3.2).toFixed(3)}`);
            if(S.grain>0)f.push(`noise=alls=${S.grain}:allf=t`);
            S.fxv.forEach(i=>CV[i]&&f.push(CV[i][2]));
            f.push(`setpts=PTS/${sp}`,`fps=${S.fps}`);
            if(fi>0)f.push(`fade=t=in:st=0:d=${fi}`);
            if(fo>0)f.push(`fade=t=out:st=${Math.max(0,dur-fo)}:d=${fo}`);
            if(S.text.trim()){
              const t=S.text.replace(/[\\':%]/g,'');
              const y=S.tpos==='t'?'h*0.08':S.tpos==='c'?'(h-text_h)/2':'h*0.85-text_h';
              f.push(`drawtext=fontfile=font.ttf:text='${t}':${(TS[+S.tstyle]||TS[0])[1]}:fontsize=h*${(S.tsize/1080).toFixed(4)}:x=(w-text_w)/2:y=${y}`);
            }
            if(S.capburn&&c.caps&&c.caps.length){
              const y=S.cappos==='t'?'h*0.1':S.cappos==='c'?'(h-text_h)/2':'h*0.84-text_h';
              c.caps.forEach((k,n)=>{
                const a=Math.max(k.a,c.start),b=Math.min(k.b,c.end);if(b-a<0.05||!String(k.t).trim())return;
                const nm=`cap${i}_${n}.txt`;files.push({n:nm,t:wrap(String(k.t))});
                f.push(`drawtext=fontfile=font.ttf:textfile=${nm}:fontcolor=white:fontsize=h*${(S.capsize/1080).toFixed(4)}:box=1:boxcolor=black@0.6:boxborderw=14:x=(w-text_w)/2:y=${y}:enable='between(t,${((a-c.start)/sp).toFixed(2)},${((b-c.start)/sp).toFixed(2)})'`);
              });
            }
            if(S.tc)f.push("drawtext=fontfile=font.ttf:text='%{pts\\:hms}':fontcolor=white:box=1:boxcolor=black@0.5:fontsize=h*0.035:x=w*0.03:y=h*0.04");
            if(S.fc)f.push("drawtext=fontfile=font.ttf:text='%{n}':fontcolor=white:box=1:boxcolor=black@0.5:fontsize=h*0.035:x=w-text_w-w*0.03:y=h*0.04");
            if(S.wm.trim()){const t=S.wm.replace(/[\\':%]/g,''),x=S.wmpos[1]==='l'?'w*0.03':'w-text_w-w*0.03',y=S.wmpos[0]==='t'?'h*0.04':'h-text_h-h*0.04';f.push(`drawtext=fontfile=font.ttf:text='${t}':fontcolor=white@0.6:borderw=2:bordercolor=black@0.5:fontsize=h*0.04:x=${x}:y=${y}`)}
            const chain=f.join(',');
            return{fc:fc?`${fc},${chain}[v]`:null,chain,files};
          }
          function af(dur,sp,fi,fo){
            const f=[];
            if(S.rev)f.push('areverse');
            f.push(atempo(sp),`volume=${S.vol}`);
            if(S.denoise)f.push('highpass=f=80,afftdn=nf=-25');
            S.fxa.forEach(i=>CA[i]&&f.push(CA[i][2]));
            if(S.norm)f.push('loudnorm=I=-16:TP=-1.5:LRA=11');
            if(fi>0)f.push(`afade=t=in:st=0:d=${fi}`);
            if(fo>0)f.push(`afade=t=out:st=${Math.max(0,dur-fo)}:d=${fo}`);
            return f.join(',');
          }
          $('cancelBtn').onclick=()=>{cancelled=true;try{ff.terminate()}catch(e){}ffReady=false};
          $('exportBtn').onclick=async()=>{
            if(!clips.length)return toast('Önce bir video ekle');
            const btn=$('exportBtn');btn.disabled=true;cancelled=false;$('prog').style.display='block';$('cancelBtn').style.display='';
            try{
              $('status').textContent='Motor yükleniyor (ilk seferde biraz sürer)...';
              total=clips.length;cur=0;$('prog').firstElementChild.style.width='0';await loadFF();
              const parts=[];
              for(let i=0;i<clips.length;i++){
                cur=i;const c=clips[i],name=`in${i}`,out=`p${i}.mp4`;
                $('status').textContent=`Klip ${i+1}/${clips.length} işleniyor...`;
                await ff.writeFile(name,await FFmpegUtil.fetchFile(c.file));
                const sp=c.speed||1,dur=(c.end-c.start)/sp,fi=i===0?S.fin:Math.max(S.fin,S.trans),fo=i===clips.length-1?S.fout:Math.max(S.fout,S.trans),V=vf(c,i,dur,sp,fi,fo);
                for(const fl of V.files)await ff.writeFile(fl.n,fl.t);
                await ff.exec(['-ss',String(c.start),'-t',String(c.end-c.start),'-i',name,...(V.fc?['-filter_complex',V.fc,'-map','[v]','-map','0:a?']:['-vf',V.chain]),'-af',af(dur,sp,fi,fo),'-c:v','libx264','-preset','ultrafast','-crf',S.crf,'-pix_fmt','yuv420p','-c:a','aac','-b:a','192k','-ar','44100','-ac','2',out]);
                await ff.deleteFile(name);parts.push(out);
              }
              let final=parts[0];
              if(parts.length>1){
                await ff.writeFile('list.txt',parts.map(p=>`file '${p}'`).join('\n'));
                await ff.exec(['-f','concat','-safe','0','-i','list.txt','-c','copy','final.mp4']);final='final.mp4';
              }
              if(music&&S.fmt!=='gif'){
                $('status').textContent='Müzik karıştırılıyor...';
                await ff.writeFile('music',await FFmpegUtil.fetchFile(music));
                await ff.exec(['-i',final,'-stream_loop','-1','-i','music','-filter_complex',`[1:a]volume=${S.mvol}[m];[0:a][m]amix=inputs=2:duration=first:dropout_transition=0[a]`,'-map','0:v','-map','[a]','-c:v','copy','-c:a','aac','-shortest','mixed.mp4']);final='mixed.mp4';
              }
              let outName=`cutlio-${S.res}p-${S.fps}fps.mp4`,mime='video/mp4';
              if(S.fmt==='gif'){$('status').textContent='GIF hazırlanıyor...';await ff.exec(['-i',final,'-vf','fps=15,scale=480:-1:flags=lanczos,split[a][b];[a]palettegen[p];[b][p]paletteuse','-loop','0','out.gif']);final='out.gif';outName='cutlio.gif';mime='image/gif'}
              if(S.fmt==='mp3'){$('status').textContent='Ses çıkarılıyor...';await ff.exec(['-i',final,'-vn','-c:a','libmp3lame','-b:a','192k','out.mp3']);final='out.mp3';outName='cutlio.mp3';mime='audio/mpeg'}
              if(S.fmt==='wav'||S.fmt==='m4a'){$('status').textContent='Ses çıkarılıyor...';await ff.exec(['-i',final,'-vn',...(S.fmt==='wav'?['-c:a','pcm_s16le']:['-c:a','aac','-b:a','192k']),'out.'+S.fmt]);final='out.'+S.fmt;outName='cutlio.'+S.fmt;mime='audio/'+S.fmt}
              const data=await ff.readFile(final);
              const url=URL.createObjectURL(new Blob([data.buffer],{type:mime}));
              const a=document.createElement('a');a.href=url;a.download=outName;a.click();
              for(const p of parts)try{await ff.deleteFile(p)}catch(e){}
              $('prog').firstElementChild.style.width='100%';$('status').textContent='Hazır. İndirme başladı.';toast('Dışa aktarma tamam!');
            }catch(e){
              $('status').textContent=cancelled?'İptal edildi.':'Dışa aktarma hatası: '+e.message+'. Daha düşük çözünürlük veya daha kısa klip dene.';ffReady=false;
            }
            btn.disabled=false;$('cancelBtn').style.display='none';
          };

          sync();preview();commit();
          setTimeout(()=>{$('splash').classList.add('hide');setTimeout(()=>$('splash').remove(),600)},1500);
          </script>
          </body>
          </html>
          CUTLIO_EOF

      - uses: actions/configure-pages@v5
